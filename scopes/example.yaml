# ---------------------------------------------------------------------------
# Example ReconX scope file. Copy this per program.
#
# The authorization block is REQUIRED. ReconX will not scan without it, and it
# is what you point at if a program ever asks what you were doing and when.
# ---------------------------------------------------------------------------

program: "Example Corp VDP"
platform: hackerone                    # hackerone | bugcrowd | intigriti | private | ...
program_url: "https://hackerone.com/example"
notes: |
  Program rules cap request rate at 5 req/s. Staging hosts are explicitly
  excluded. Report criticals within 24h.

authorization:
  authorized_by: "you@example.com"
  date: "2026-09-28"
  attestation: >
    I am enrolled in this program and authorized to test the scope listed
    below, and I will stay within the program's published rules.
  reference: "https://hackerone.com/example/policy"   # optional

# ---------------------------------------------------------------------------
# What you MAY touch.
#   *.example.com             apex + every subdomain (wildcard program)
#   api.example.io            one exact host
#   203.0.113.0/24            an IP range
#   https://shop.example.net/api/*   host + path prefix only
#   re:^prod-\d+\.example\.com$      explicit regex for awkward cases
# ---------------------------------------------------------------------------
in_scope:
  - "*.example.com"
  - "api.example.io"
  - "203.0.113.0/24"

# ---------------------------------------------------------------------------
# What you may NOT touch. These always win over in_scope, so a wildcard with
# carve-outs behaves the way the program means it.
# ---------------------------------------------------------------------------
out_of_scope:
  - "payments.example.com"
  - "*.internal.example.com"
  - "*.staging.example.com"
  - "https://example.com/logout"

# ---------------------------------------------------------------------------
# Politeness. Program limits belong here and override global .env settings.
# ---------------------------------------------------------------------------
limits:
  requests_per_second_per_host: 5
  max_concurrent_hosts: 5
  max_concurrent_requests: 20

# ---------------------------------------------------------------------------
# How this program is scanned. Everything here is optional, and everything here
# reaches a *scheduled* scan as well as a manual one -- which is the point of
# the block existing. CLI flags cannot tune a scan nobody is typing, so a
# program under 24/7 monitoring can only be configured from here.
#
# CLI flags still win where you pass them, for a one-off run.
# ---------------------------------------------------------------------------
scan_options:
  # Wordlists. One file cannot serve all three: subdomain labels, URL paths and
  # parameter names have nothing in common. The built-in lists are fallbacks
  # (235 labels, 72 paths, 103 names), not wordlists -- `reconx doctor` says
  # where to get SecLists.
  # subdomain_wordlist: "~/SecLists/Discovery/DNS/subdomains-top1million-110000.txt"
  # path_wordlist:      "~/SecLists/Discovery/Web-Content/raft-medium-directories.txt"
  # parameter_wordlist: "~/SecLists/Discovery/Web-Content/burp-parameter-names.txt"

  # Breadth. Turn brute forcing off for a program that asks you not to, or to
  # keep a scheduled scan cheap.
  brute_force_subdomains: true
  brute_force_paths: true
  guess_parameters: true
  crawl: true
  archives: true              # historical URLs from Wayback and gau
  use_external_tools: true    # false forces the built-in Python paths

  # Vulnerability classes. Valid names: sqli, xss, redirect, cors, traversal,
  # ssti, cmdi, ssrf. An unknown name is rejected when the scope is loaded
  # rather than silently ignored.
  skip_checks: []
  run_nuclei: true
  enable_timing: true         # the time-based SQLi oracle; slow, never confirms alone
  headless_xss: true          # real browser execution, which is what Confirmed means

  # Ports for the resolve/probe stage. Empty means the built-in set.
  ports: []
